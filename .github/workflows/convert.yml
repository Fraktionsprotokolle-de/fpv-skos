name: SKOS Data Conversion

on:
  push:
    paths:
      - 'src/fpv.ttl'
  workflow_dispatch:

jobs:
  convert-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib

      - name: Prepare Directories
        run: |
          mkdir -p dist/xml
          mkdir -p dist/json

      - name: Run Conversion Scripts
        run: |
          python scripts/skos2xml.py
          python scripts/ttl2jsonl.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/
          if git diff --quiet --staged; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Automatisierte Konvertierung: fpv.ttl aktualisiert"
            git push
          fi