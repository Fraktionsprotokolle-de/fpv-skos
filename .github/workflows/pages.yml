name: Build FPV

on:
  push:
    branches: [ main ]
    paths:
      - 'src/fpv.ttl'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install rdflib

      - name: Prepare Directories
        run: |
          mkdir -p dist/xml
          mkdir -p dist/json
          mkdir -p docs

      - name: Generate XML
        run: python scripts/skos2xml.py

      - name: Generate JSONL
        run: python scripts/ttl2jsonl.py

      - name: Generate HTML
        run: python scripts/build_html.py

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/ docs/
          if git diff --quiet --staged; then
            echo "No changes to commit."
          else
            git commit -m "Automated build: update XML, JSON and HTML"
            git push
          fi