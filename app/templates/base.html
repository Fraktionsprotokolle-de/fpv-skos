<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FPV-Editor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="site-title">
        <h1><a href="{{ url_for('index') }}">FPV-Editor</a></h1>
        <div class="subtitle">Pflegeoberfläche für die fpv.ttl</div>
      </div>
      <nav>
        <a href="{{ url_for('index') }}">Übersicht</a>
        <a href="{{ url_for('entry_new') }}">Neuer Eintrag</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
